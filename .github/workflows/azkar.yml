name: Azkar reminders

on:
  schedule:
    # Times are UTC. Riyadh = UTC+3.
    # 00:15 UTC = 03:15 Riyadh: starts before Fajr, waits for Fajr + 15 min.
    - cron: "15 0 * * *"
    # 11:00 UTC = 14:00 Riyadh: starts before Asr, waits for Asr + 15 min.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: test
        options:
          - test
          - sabah-now
          - masa-now
          - find-chat-id

permissions:
  actions: write

jobs:
  azkar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post azkar to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          CITY: ${{ vars.CITY || 'Riyadh' }}
          COUNTRY: ${{ vars.COUNTRY || 'Saudi Arabia' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Riyadh' }}
          SABAH_OFFSET_MIN: ${{ vars.SABAH_OFFSET_MIN || '15' }}
          MASA_OFFSET_MIN: ${{ vars.MASA_OFFSET_MIN || '15' }}
          MODE: ${{ inputs.mode || 'scheduled' }}
        run: |
          case "$MODE" in
            test)         python send_azkar.py --test ;;
            sabah-now)    python send_azkar.py --session sabah --now ;;
            masa-now)     python send_azkar.py --session masa --now ;;
            find-chat-id) python send_azkar.py --find-chat-id ;;
            *)            python send_azkar.py ;;
          esac

      # GitHub pauses schedules after 60 days without changes; this keeps it on.
      - name: Keep schedule active
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable azkar.yml --repo "$GITHUB_REPOSITORY"
